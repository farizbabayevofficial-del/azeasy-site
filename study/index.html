<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AzEasier study</title>
<style>
:root { --bg: #fff; --fg: #15171a; --muted: #5d6470; --line: #d5d9e0; --accent: #0b6e4f; --accent-fg: #fff;
  --pick: #e3f3ec; --error: #b3261e; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #121417; --fg: #eef0f3; --muted: #a3aab5; --line: #343a43; --accent: #3fbf8f; --accent-fg: #0b1410;
    --pick: #1d3a2f; --error: #ff8a80; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 24px; margin: 0 0 16px; }
p, li { margin: 0 0 12px; }
label { display: block; font-weight: 600; margin: 16px 0 6px; }
input[type=text], input[type=email] { width: 100%; font-size: 20px; padding: 12px; border: 2px solid var(--line);
  border-radius: 10px; background: var(--bg); color: var(--fg); }
button { font: inherit; cursor: pointer; }
.primary { display: block; width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 12px;
  background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 20px; }
.primary:disabled { opacity: .45; cursor: default; }
.choice { display: block; width: 100%; text-align: left; margin: 10px 0; padding: 14px; border: 2px solid var(--line);
  border-radius: 12px; background: var(--bg); color: var(--fg); font-size: 19px; }
.choice[aria-pressed=true] { border-color: var(--accent); background: var(--pick); font-weight: 700; }
.choice.unknown { color: var(--muted); font-size: 16px; }
.langs button { margin: 6px 6px 0 0; padding: 10px 14px; border: 2px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--fg); }
.langs button[aria-pressed=true] { border-color: var(--accent); font-weight: 700; }
.prompt { font-size: 28px; font-weight: 700; margin: 12px 0 8px; }
.play { padding: 14px 20px; border: 2px solid var(--accent); border-radius: 12px; background: var(--bg); color: var(--fg);
  font-size: 20px; font-weight: 700; }
.muted { color: var(--muted); font-size: 15px; }
.error { color: var(--error); font-weight: 600; }
.box { display: flex; gap: 10px; align-items: flex-start; margin: 12px 0; font-weight: 400; }
.box input { width: 24px; height: 24px; flex: none; margin-top: 2px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; margin-bottom: 16px; }
.bar div { height: 6px; background: var(--accent); border-radius: 3px; }
</style>
</head>
<body>
<main id="app"><p>…</p></main>
<noscript>Please turn on JavaScript.</noscript>
<script src="../verify-config.js"></script>
<script src="study.js"></script>
</body>
</html>
